# Learning Locker LRS Docker Compose 설정
# xAPI 기반 학습 기록 저장소 (Learning Record Store)
# GitHub에서 직접 빌드

services:
  # MongoDB - Learning Locker의 주 데이터베이스
  mongodb:
    image: mongo:4.4
    container_name: ll_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-admin123}
      - MONGO_INITDB_DATABASE=${MONGO_DB:-learninglocker}
    volumes:
      - ./storage/mongo:/data/db
    ports:
      - "27017:27017"
    networks:
      - ll_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - 세션 및 큐 관리
  redis:
    image: redis:6-alpine
    container_name: ll_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - ./storage/redis:/data
    ports:
      - "6379:6379"
    networks:
      - ll_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Learning Locker API 서버
  ll_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: learninglocker-custom:latest
    container_name: ll_api
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - APP_SECRET=${APP_SECRET:-learninglocker-secret-key-change-this}
      - MONGODB_PATH=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB:-learninglocker}?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - REDIS_PREFIX=learninglocker
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURED=${SMTP_SECURED:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Learning Locker}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-noreply@learninglocker.net}
      - API_PORT=8080
      - UI_PORT=3000
      - QUEUE_PROVIDER=REDIS
      - QUEUE_NAMESPACE=learninglocker_queue
    command: node api/dist/server.js
    volumes:
      - ./storage/app:/opt/learninglocker/storage
    ports:
      - "8080:8080"
    networks:
      - ll_network

  # Learning Locker UI 서버
  ll_ui:
    image: learninglocker-custom:latest
    container_name: ll_ui
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - ll_api
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - APP_SECRET=${APP_SECRET:-learninglocker-secret-key-change-this}
      - MONGODB_PATH=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB:-learninglocker}?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - REDIS_PREFIX=learninglocker
      - API_HOST=ll_api
      - API_PORT=8080
      - UI_PORT=3000
      - QUEUE_PROVIDER=REDIS
      - QUEUE_NAMESPACE=learninglocker_queue
    command: node ui/dist/server.js
    volumes:
      - ./storage/app:/opt/learninglocker/storage
    ports:
      - "3000:3000"
    networks:
      - ll_network

  # Learning Locker Worker - 백그라운드 작업 처리
  ll_worker:
    image: learninglocker-custom:latest
    container_name: ll_worker
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - APP_SECRET=${APP_SECRET:-learninglocker-secret-key-change-this}
      - MONGODB_PATH=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB:-learninglocker}?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - REDIS_PREFIX=learninglocker
      - QUEUE_PROVIDER=REDIS
      - QUEUE_NAMESPACE=learninglocker_queue
    command: node worker/dist/server.js
    volumes:
      - ./storage/app:/opt/learninglocker/storage
    networks:
      - ll_network

  # Nginx - 리버스 프록시 (API와 UI를 하나의 도메인으로 통합)
  nginx:
    image: nginx:alpine
    container_name: ll_nginx
    restart: unless-stopped
    depends_on:
      - ll_api
      - ll_ui
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ll_network

networks:
  ll_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  app_storage:
